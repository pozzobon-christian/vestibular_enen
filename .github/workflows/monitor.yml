name: Monitor de influenciadores

on:
  schedule:
    - cron: "17 */6 * * *"      # a cada 6 horas
  workflow_dispatch:
    inputs:
      diag:
        description: "Só diagnóstico do YouTube para este handle/nome (vazio = coleta normal)"
        required: false
        default: ""
  push:
    paths: [".github/workflows/monitor.yml"]   # registra o workflow e faz a 1ª coleta

permissions:
  contents: write

concurrency:
  group: monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e "assessor"
      - name: Coletar, analisar e exportar
        working-directory: assessor
        env:
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
          REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
          REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
        run: |
          if [ -n "${{ github.event.inputs.diag }}" ]; then python -m advisor.monitor diag --query "${{ github.event.inputs.diag }}"; else python -m advisor.monitor run; fi
      - name: Versionar dados
        if: ${{ github.event.inputs.diag == '' }}
        working-directory: assessor
        run: |
          git config user.name "monitor-bot"
          git config user.email "monitor-bot@users.noreply.github.com"
          git add data/monitor.db data/exports data/relatorio.json data/RELATORIO.md data/influencers.json data/dashboard-data.json
          git diff --cached --quiet && echo "sem novidades" || git commit -m "monitor: coleta $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase origin "${{ github.ref_name }}" || true
          git push origin HEAD:"${{ github.ref_name }}"
