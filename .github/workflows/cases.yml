name: Casos de 10 anos (day trade B3)

on:
  workflow_dispatch:
  push:
    paths: [".github/workflows/cases.yml"]

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e "assessor"
      - name: Estudo de 10 anos
        working-directory: assessor
        run: python -m advisor.cases
      - name: Versionar
        working-directory: assessor
        run: |
          git config user.name "monitor-bot"
          git config user.email "monitor-bot@users.noreply.github.com"
          git add data/cases/estudo-10-anos.json || true
          git diff --cached --quiet && echo "sem novidades" || git commit -m "casos 10 anos: $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase origin "${{ github.ref_name }}" || true
          git push origin HEAD:"${{ github.ref_name }}"
